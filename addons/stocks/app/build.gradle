plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.salvomorph.stocks'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.salvomorph.stocks'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies: plain Android framework classes only, so the APK stays tiny.